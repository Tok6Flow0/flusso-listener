name: Owner signing-key migration
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [export, verify]
        required: true
        default: export
permissions:
  contents: read
jobs:
  export:
    if: github.actor == 'Tok6Flow0' && github.ref == 'refs/heads/main' && inputs.mode == 'export'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Seal existing signing key for the owner
        env:
          UPDATE_KEY: ${{ secrets.ELECTRON_BUILDER_UPDATE_SIGN_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash, createPrivateKey, createPublicKey, publicEncrypt, constants } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const transportPublicKey = `-----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAnYFkBTvnyOFHigtqreZ9
          qtn8mBrejZGNVc0Q8qbZYuHYDWAJnwugvwUYsTWuRm8esP8LfrjGVwAn1zl6039x
          t3Nz4S98SOq/juaansof31lHDgpT0Ztudrl8+agtlVKyjfSG6T7RjKU9Gtr2B/yt
          dUHCLe79o+vyengFgmU6Ub9XGkPQWKBxRfmeu0tYf/v2P+JLTpOa1HeoZvUDZ62C
          tVohmVAC02o7HVpqqQrDGTVlCUBVRiRZdFI06d0wAPx6Ktcx6ytH+KlCSlnx2Dfg
          wVMPtQRhDSIRa7TyxPiUlmWvuSeMpIKJrGcKNYNFEbrefKcp48V/0/WNWL9y+EJb
          dmIlYOFW8Hwk7LkxqjkW1Je/G12heUgMnV9Z/h5ZPb1RTrCqcCzkoBHuuVcuOP6e
          cFRM+sFCz2JdwvDQU24Lmmid6JjsL7m9/tUP2AHZOQsJevhEF0lVWnpVLwGiDyV3
          nD5gzIGN1HIsOZvr6tEgqXeK8sZcoPh142rcNxsiMYd+GPOVMptwvih1oc+iVoyN
          Lcxj6OWfwrpyYgPR36bSLuN7BMH3nsEJmPVyazRl1CpHUzbna9nmtzk+lrjgRiMu
          3062pYMH15swC9qdOkB6Kk8gfAF5W/Bl1j0UayzjU687TzmfjtF5LUEgzkFdKWyJ
          yjGI9Lbt1PaHqPPUqoloEykCAwEAAQ==
          -----END PUBLIC KEY-----`;
          const value = Buffer.from(process.env.UPDATE_KEY || '');
          delete process.env.UPDATE_KEY;
          if (!value.length || value.length > 446) throw new Error('Signing key absent or exceeds RSA-OAEP payload bound.');
          const key = createPrivateKey(value);
          if (key.asymmetricKeyType !== 'ed25519') throw new Error('Unexpected signing-key type.');
          const fingerprint = createHash('sha256').update(createPublicKey(key).export({type:'spki',format:'der'})).digest('hex');
          const sealed = publicEncrypt({key:transportPublicKey,oaepHash:'sha256',padding:constants.RSA_PKCS1_OAEP_PADDING},value);
          value.fill(0);
          writeFileSync('sealed-signing-key.json',JSON.stringify({schemaVersion:1,fingerprint,ciphertext:sealed.toString('base64')}),{mode:0o600,flag:'wx'});
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owner-sealed-signing-key
          path: sealed-signing-key.json
          retention-days: 1
          if-no-files-found: error
  verify:
    if: github.actor == 'Tok6Flow0' && github.ref == 'refs/heads/main' && inputs.mode == 'verify'
    environment: release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify protected key identity without exposing it
        env:
          UPDATE_KEY: ${{ secrets.ELECTRON_BUILDER_UPDATE_SIGN_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash, createPrivateKey, createPublicKey } from 'node:crypto';
          const value = Buffer.from(process.env.UPDATE_KEY || '');
          delete process.env.UPDATE_KEY;
          if (!value.length) throw new Error('Protected signing key is absent.');
          const key = createPrivateKey(value);
          value.fill(0);
          if (key.asymmetricKeyType !== 'ed25519') throw new Error('Unexpected signing-key type.');
          console.log('Protected signing public-key SHA256: '+createHash('sha256').update(createPublicKey(key).export({type:'spki',format:'der'})).digest('hex'));
          NODE
